function formatCreatorNumber(el){if(!el)return;const raw=String(el.value||'').replace(/,/g,'').replace(/[^0-9.]/g,'');if(raw===''){el.value='';return}const parts=raw.split('.');const whole=(parts.shift()||'').replace(/^0+(?=\d)/,'')||'0';el.value=Number(whole).toLocaleString('en-US')+(parts.length?'.'+parts.join('').slice(0,2):'')}
function numericCreatorValue(v){return Number(String(v==null?'':v).replace(/,/g,''))||0}
function renderKOLs(){if(!state.kols.length){$('kolList').innerHTML='<div class="empty">No KOLs yet. Add your first creator.</div>';return}$('kolList').innerHTML=state.kols.map((k,i)=>`<article class="kol"><div class="kolhead"><img class="photo" id="photo-${i}" src="${esc(k.photoUrl||'')}" onerror="this.style.display='none'"><div><div class="kolname">${esc(k.name||'KOL '+(i+1))}</div><div class="koldesc">${esc(k.platform||'')} · ${esc(k.category||'')} · ${k.followers?esc(Number(String(k.followers).replace(/,/g,'')) .toLocaleString('en-US'))+' followers':'Profile data pending'}</div></div><button class="btn danger" onclick="removeKOL(${i})">Remove</button></div><div class="grid3" style="margin-top:13px"><div class="field"><label>Name <em class="req">*</em></label><input value="${esc(k.name)}" placeholder="e.g. Tontawan / Pimtha / Creator Name" oninput="state.kols[${i}].name=this.value"></div><div class="field"><label>Platform</label><select onchange="state.kols[${i}].platform=this.value"><option ${k.platform==='Instagram'?'selected':''}>Instagram</option><option ${k.platform==='TikTok'?'selected':''}>TikTok</option><option ${k.platform==='YouTube'?'selected':''}>YouTube</option><option ${k.platform==='Facebook'?'selected':''}>Facebook</option></select></div><div class="field"><label>Followers</label><input type="text" inputmode="numeric" value="${esc(k.followers?Number(String(k.followers).replace(/,/g,'')).toLocaleString('en-US'):'')}" placeholder="e.g. 1,250,000" oninput="formatCreatorNumber(this);state.kols[${i}].followers=this.value" onblur="formatCreatorNumber(this)"></div><div class="field"><label>Engagement rate %</label><input type="number" min="0" max="100" step="0.01" value="${esc(k.engagementRate)}" placeholder="e.g. 4.8" oninput="state.kols[${i}].engagementRate=this.value"></div><div class="field"><label>Commercial rate</label><input type="text" inputmode="numeric" value="${esc(k.rate?Number(String(k.rate).replace(/,/g,'')).toLocaleString('en-US'):'')}" placeholder="e.g. 80,000 THB" oninput="formatCreatorNumber(this);state.kols[${i}].rate=this.value" onblur="formatCreatorNumber(this)"></div><div class="field"><label>Platform URL</label><input value="${esc(k.platformUrl)}" placeholder="https://instagram.com/creator" oninput="state.kols[${i}].platformUrl=this.value"></div></div><div class="upload" style="margin-top:12px"><label>Creator image <span class="sub">Upload — no image URL required</span></label><input type="file" accept="image/*" onchange="uploadPhoto(${i},this)"></div><h3>Creator audience evidence</h3><div class="grid3"><div class="field"><label>Age range <em class="req">*</em></label><input value="${esc(k.audienceAge)}" placeholder="e.g. 24–35" oninput="state.kols[${i}].audienceAge=this.value"></div><div class="field"><label>Gender <em class="req">*</em></label><input value="${esc(k.audienceGender)}" placeholder="e.g. Female / Mixed" oninput="state.kols[${i}].audienceGender=this.value"></div><div class="field"><label>Location</label><input value="${esc(k.audienceLocation)}" placeholder="e.g. Bangkok / Thailand" oninput="state.kols[${i}].audienceLocation=this.value"></div><div class="field"><label>Audience interests <em class="req">*</em></label><input value="${esc(k.audienceInterest||'')}" placeholder="e.g. women's fashion, styling, café, beauty" oninput="state.kols[${i}].audienceInterest=this.value"></div><div class="field"><label>Content style <em class="req">*</em></label><input value="${esc(k.contentStyle||'')}" placeholder="e.g. styling reels, GRWM, reviews, live shopping" oninput="state.kols[${i}].contentStyle=this.value"></div></div><div class="grid"><div class="field"><label>Observed behavior</label><textarea placeholder="e.g. followers save/share styling posts; strong comments on outfit content" oninput="state.kols[${i}].audienceBehavior=this.value">${esc(k.audienceBehavior)}</textarea><small class="hint">What the audience actually does, not what you hope they do.</small></div><div class="field"><label>Creator description</label><textarea placeholder="e.g. feminine fashion creator focused on wearable office-to-weekend styling" oninput="state.kols[${i}].description=this.value">${esc(k.description)}</textarea></div></div><h3>Campaign & evidence signals <span class="sub">These improve campaign-match confidence.</span></h3><div class="grid"><div class="field"><label>Audience evidence <em class="req">*</em></label><textarea placeholder="e.g. platform insight, audience screenshot summary, demographic source" oninput="state.kols[${i}].audienceEvidence=this.value">${esc(k.audienceEvidence||'')}</textarea></div><div class="field"><label>Engagement evidence</label><textarea placeholder="e.g. recent post ER, average comments/saves/shares, source/date" oninput="state.kols[${i}].engagementEvidence=this.value">${esc(k.engagementEvidence||'')}</textarea></div><div class="field"><label>Content evidence</label><textarea placeholder="e.g. examples showing styling/review/GRWM/product content fit" oninput="state.kols[${i}].contentEvidence=this.value">${esc(k.contentEvidence||'')}</textarea></div><div class="field"><label>Performance evidence</label><textarea placeholder="e.g. clicks, orders, revenue, ROAS or other verified campaign evidence" oninput="state.kols[${i}].performanceEvidence=this.value">${esc(k.performanceEvidence||'')}</textarea></div><div class="field"><label>Reputation / safety evidence</label><textarea placeholder="e.g. known brand-safety concerns or verified clean history" oninput="state.kols[${i}].reputationEvidence=this.value">${esc(k.reputationEvidence||'')}</textarea></div><div class="field"><label>Risk level</label><select onchange="state.kols[${i}].riskLevel=this.value"><option value="LOW" ${String(k.riskLevel||'LOW').toUpperCase()==='LOW'?'selected':''}>LOW</option><option value="MEDIUM" ${String(k.riskLevel||'').toUpperCase()==='MEDIUM'?'selected':''}>MEDIUM</option><option value="HIGH" ${String(k.riskLevel||'').toUpperCase()==='HIGH'?'selected':''}>HIGH</option></select><small class="hint">Use only when there is evidence; do not guess.</small></div></div>${k.analyzed?renderAnalysis(k,i):''}</article>`).join('')}
function renderAnalysis(k,i){const a=k.analysis||{};const dims=[['Brand fit',a.brandFit],['Audience fit',a.audienceFit],['Campaign fit',a.campaignFit],['Content fit',a.contentFit],['Value fit',a.valueFit],['Confidence',a.confidence],['Impact',a.impact],['Safety',a.safety]];return `<div class="fitAction"><div class="koltop"><div><b>Analysis result</b><div class="koldesc">Calculated from the canonical decision engine.</div></div><span class="badge ${scoreClass(a.fit)}">Fit ${fmtScore(a.fit)}</span></div><div class="scoregrid">${dims.map(x=>`<div class="score"><span>${esc(x[0])}</span><b>${fmtScore(x[1])}</b><div class="bar"><i style="width:${Math.max(0,Math.min(100,num(x[1])))}%"></i></div></div>`).join('')}</div><div style="margin-top:10px;font-size:13px"><b>Decision:</b> ${esc(a.decision||'Review')} · <b>Risk:</b> ${esc(a.risk||'—')} · <b>Confidence:</b> ${fmtScore(a.confidence)}</div>${a.decision&&String(a.decision).toUpperCase().includes('NOT')?`<div class="status warn"><i class="dotStatus"></i><span><b>How to improve fit:</b> ${esc(a.remediation||'Strengthen audience alignment, content relevance, proof of performance and campaign-specific creative before selection.')}</span></div>`:''}<label class="selectline" style="margin-top:12px"><input type="checkbox" ${k.selected?'checked':''} onchange="toggleSelect(${i},this.checked)"> Select this KOL for the campaign shortlist</label></div>`}
function scoreClass(v){return num(v)>=70?'b-good':num(v)>=50?'b-warn':'b-bad'}function fmtScore(v){return v===''||v==null?'—':Math.round(num(v))}
async function uploadPhoto(i,input){const f=input.files&&input.files[0];if(!f)return;if(f.size>5*1024*1024){alert('Please use an image under 5 MB.');input.value='';return}const reader=new FileReader();reader.onload=async()=>{try{setStatus('analysisStatus','Uploading image…','busy');const r=await server('KOL_IDS_SELF_UPLOAD_IMAGE',{data:reader.result,name:f.name,mimeType:f.type});state.kols[i].photoUrl=r.url;renderKOLs();setStatus('analysisStatus','Image uploaded successfully.','good')}catch(e){setStatus('analysisStatus',e.message,'bad')}};reader.readAsDataURL(f)}

async function analyzeKOLs(){if(!validateAudience())return;const valid=state.kols.filter(k=>k.name.trim());if(!valid.length){alert('Add at least one KOL.');return}setStatus('analysisStatus','Saving campaign context and analyzing creator candidates…','busy');try{state.kols.forEach(k=>{if(!k.creatorId)k.creatorId=k.id||('CR-'+cryptoRandomId_());if(!k.id)k.id=k.creatorId});const payload=buildPayload();const save=await server('KOL_IDS_SELF_SAVE',payload);KOL_IDS_CANONICAL_apply_(save);state.analysis=save;const run=await server('KOL_IDS_SELF_RUN',{mode:'CANDIDATE_ANALYSIS'});KOL_IDS_CANONICAL_apply_(run);const report=await server('KOL_IDS_SELF_GET_REPORT');applyReportToKOLs(report);setStatus('analysisStatus',`Analysis complete · ${report.count||state.kols.length} creator results calculated. Select one or more creators to build the shortlist.`,'good');$('analysisPill').textContent=save.analysisId||'Active analysis';go(4);}catch(e){setStatus('analysisStatus',String(e?.message||e),'bad')}}
function applyReportToKOLs(report){state.report=report;const h=report.headers||[];const idx={};h.forEach((x,i)=>idx[String(x).toLowerCase()]=i);state.kols.forEach(k=>{const row=(report.rows||[]).find(r=>String(r[idx['kol id']]||'')===String(k.id)||String(r[idx['kol name']]||'')===String(k.name));if(!row)return;const val=n=>idx[n]!=null?num(row[idx[n]]):'';k.analyzed=true;k.analysis={fit:val('brand fit score'),impact:val('brand impact score'),confidence:val('confidence score'),risk:idx['risk level']!=null?row[idx['risk level']]: '',decision:idx['decision']!=null?row[idx['decision']]: 'Review',brandFit:val('brand fit score'),audienceFit:val('audience fit'),campaignFit:val('content fit'),contentFit:val('content fit'),valueFit:val('value fit'),safety:100,remediation:idx['not ideal for']!=null?row[idx['not ideal for']]:''};});renderKOLs()}

function go(n){

    setStatus('analysisStatus','Invalid workflow destination.','bad');

  try{

    setStatus('analysisStatus','Opened workflow stage '+n+'.','good');

  const riskDots=riskRows.map(x=>`<div class="kcc-risk-row"><div class="kcc-risk-name"><b>${esc(x.name||'—')}</b><span>${esc(x.risk||'UNKNOWN')}</span></div><div class="kcc-risk-track"><i style="width:${Math.max(4,Math.min(100,KOL_IDS_CC_score(x.score)||10))}%"></i></div><strong>${KOL_IDS_CC_score(x.score)}</strong></div>`).join('')||'<div class="kcc-empty">No decision rows yet.</div>';
  const allocation=selected.map(x=>`<div class="kcc-alloc"><div><b>${esc(x.name||'—')}</b><small>${esc(x.reason||'Portfolio-selected creator')}</small></div><div class="kcc-alloc-meta"><b>${KOL_IDS_CC_money(x.cost,currency)}</b><span>${KOL_IDS_CC_score(x.score)} score</span></div></div>`).join('')||'<div class="kcc-empty">Run Portfolio Intelligence after creator analysis to populate allocation.</div>';
  const trendHtml=trend.length?trend.map(x=>`<div class="kcc-trend-row"><span>${esc(x.date.slice(5))}</span><div class="kcc-trend-bars"><i title="Revenue" style="width:${Math.max(2,x.revenue/trendMax*100)}%"></i><em title="Spend" style="width:${Math.max(2,x.spend/trendMax*100)}%"></em></div><b>${x.revenue>0?KOL_IDS_CC_money(x.revenue,currency):'—'}</b></div>`).join(''):'<div class="kcc-empty">No observed outcome trend yet. Capture verified performance to activate it.</div>';
  const grade=im.evidenceGrade||'—', gradeClass=KOL_IDS_CC_evidenceClass(grade);
  host.innerHTML=`<div class="kcc-shell">
    <div class="kcc-topline"><div><span class="kcc-eyebrow">KOL IDS · EXECUTIVE DASHBOARD</span><h2>Executive Dashboard</h2><p>A single decision surface for campaign health, creator selection, capital deployment and verified evidence.</p></div><div class="kcc-actions"><span class="kcc-live"><i></i> Canonical data</span><button class="btn ghost" type="button" onclick="loadExecutiveCommandCenter(true)">Refresh</button></div></div>
    <div class="kcc-kpis">
      <div class="kcc-kpi hero"><span>Campaign health</span><b>${esc(String(report?.dashboard?.healthScore??report?.campaignHealth??'—'))}</b><small>Decision confidence layer</small></div>
      <div class="kcc-kpi"><span>Spend tracked</span><b>${KOL_IDS_CC_money(spend,currency)}</b><small>Recorded spend</small></div>
      <div class="kcc-kpi"><span>Observed revenue</span><b>${KOL_IDS_CC_money(revenue,currency)}</b><small>Evidence-bound</small></div>
      <div class="kcc-kpi"><span>Observed ROAS</span><b>${roas==null?'—':roas.toFixed(2)+'x'}</b><small>Not a causal claim</small></div>
      <div class="kcc-kpi"><span>Conversions</span><b>${conversions.toLocaleString('en-US')}</b><small>${clicks.toLocaleString('en-US')} clicks</small></div>
      <div class="kcc-kpi"><span>Evidence strength</span><b class="grade-${gradeClass}">${esc(String(grade))}</b><small>${Number(im.pairedOutcomes||0)} paired outcomes</small></div>
    </div>
    <div class="kcc-grid2">
      <article class="kcc-panel kcc-funnel"><div class="kcc-panel-head"><div><span>DECISION FUNNEL</span><h3>From analysis to action</h3></div><b>${decisionCount} creators</b></div><div class="kcc-funnel-grid"><div><b>${decisionCount}</b><span>Assessed</span></div><div><b>${recommended}</b><span>Recommended</span></div><div><b>${review}</b><span>Review</span></div><div><b>${highRisk}</b><span>High risk</span></div></div><div class="kcc-mini-note">Recommendation quality is separated from actual outcome evidence.</div></article>
      <article class="kcc-panel"><div class="kcc-panel-head"><div><span>CAPITAL DEPLOYMENT</span><h3>Portfolio allocation</h3></div><b>${selected.length} selected</b></div><div class="kcc-budget"><div><span>Planned</span><b>${KOL_IDS_CC_money(p.plannedSpend,currency)}</b></div><div><span>Remaining</span><b>${KOL_IDS_CC_money(p.budgetRemaining,currency)}</b></div><div><span>Utilization</span><b>${utilization==null?'—':utilization.toFixed(0)+'%'}</b></div></div><div class="kcc-alloc-list">${allocation}</div></article>
    </div>
    <div class="kcc-grid2">
      <article class="kcc-panel"><div class="kcc-panel-head"><div><span>OUTCOME TREND</span><h3>Revenue vs spend</h3></div><b>${trend.length?trend.length+' periods':'No data'}</b></div><div class="kcc-legend"><span><i class="rev"></i>Revenue</span><span><i class="spend"></i>Spend</span></div><div class="kcc-trend">${trendHtml}</div></article>
      <article class="kcc-panel"><div class="kcc-panel-head"><div><span>RISK MATRIX</span><h3>Decision exposure</h3></div><b>${highRisk} high risk</b></div><div class="kcc-axis"><span>LOW</span><span>DECISION SCORE</span><span>HIGH</span></div><div class="kcc-risk">${riskDots}</div></article>
    </div>
    <div class="kcc-bottom"><div><b>Evidence status</b><span>${grade==='A'||grade==='B'?'Evidence loop is active.':'More verified outcomes are required before strong learning claims.'}</span></div><div><b>Decision accuracy</b><span>${im.decisionAccuracy==null?'—':im.decisionAccuracy+'%'} · Rank correlation ${im.predictionRankCorrelation==null?'—':im.predictionRankCorrelation}</span></div><div><b>Potentially inefficient spend</b><span>${KOL_IDS_CC_money(im.potentiallyInefficientSpend,currency)} flagged for review</span></div></div>
  </div>`;
}

/* Decision Intelligence UI: live and no-save simulation views. */
function decisionTone(rec){return rec==='PROCEED'?'good':rec==='REQUEST_EVIDENCE'?'warn':'bad'}

async function loadExecutiveDashboard(){
  const host=$('executiveDashboard'); if(!host)return;
  host.innerHTML='<div class="exec-loading">Refreshing executive dashboard…</div>';
  try{
    const d=await server('KOL_IDS_SYSTEM_SAAS_GET_DASHBOARD');
    const x=d&&d.dashboard?d.dashboard:{};
    const report=d&&d.report?d.report:{};
    const rows=Array.isArray(report.rows)?report.rows:[];
    const headers=Array.isArray(report.headers)?report.headers:[];
    function idx(names){for(const n of names){const i=headers.findIndex(h=>String(h||'').trim().toLowerCase()===n.toLowerCase());if(i>=0)return i}return -1}
    const scoreI=idx(['Decision Score','Overall Score','Fit Score','Brand Fit Score']);
    const nameI=idx(['KOL Name','Creator Name','Name']);
    const decisionI=idx(['Decision','Recommendation','Status']);
    const confI=idx(['Confidence Score','Confidence']);
    const riskI=idx(['Risk']);
    const scores=rows.map(r=>Number(r[scoreI])).filter(Number.isFinite);
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
    const recommended=rows.filter(r=>/select|proceed|approved|recommended|strong/i.test(String(r[decisionI]||''))).length;
    const review=rows.filter(r=>/review/i.test(String(r[decisionI]||''))).length;
    const top=[...rows].sort((a,b)=>(Number(b[scoreI])||0)-(Number(a[scoreI])||0)).slice(0,5);
    const health=Number(x.healthScore);
    const healthLabel=x.campaignHealth||'—';
    const card=(label,val,sub,accent)=>`<div class="exec-kpi ${accent?'accent':''}"><span>${esc(label)}</span><b>${esc(String(val))}</b><small>${esc(sub||'')}</small></div>`;
    const topName=top[0]?String(top[0][nameI]||'Top creator'):'—';
    const decision=top[0]?String(top[0][decisionI]||'—'):'—';
    const risk=top[0]?String(top[0][riskI]||'—'):'—';
    host.innerHTML=
      card('Campaign health',Number.isFinite(health)?health+'/100':healthLabel,'Canonical dashboard status',true)+
      card('Creators assessed',rows.length,'Current decision report')+
      card('Recommended',recommended,'Decision-positive records')+
      card('Review required',review,'Needs evidence / review')+
      `<div class="exec-decision"><div class="exec-eyebrow" style="color:#12a8c5">PRIMARY SIGNAL</div><strong>${esc(topName)}</strong><div style="margin-top:8px;color:#766a70">${esc(decision)} · Risk ${esc(risk)}</div><div style="margin-top:10px;font-size:28px;font-weight:900">${scores.length?avg(scores):'—'}<span style="font-size:12px;color:#766a70"> avg decision score</span></div></div>`+
      `<div class="exec-rank"><div style="font-weight:900;margin-bottom:4px">Top creator ranking</div><div style="font-size:11px;color:#766a70;margin-bottom:7px">Sorted by current canonical decision score.</div>`+
      top.map((r,i)=>`<div class="exec-rank-row"><b>#${i+1}</b><span>${esc(String(r[nameI]||'Creator'))}</span><span class="exec-score">${esc(String(Number(r[scoreI])||0))}</span><span class="exec-pill">${esc(String(r[decisionI]||'—'))}</span></div>`).join('')+
      `</div>`;
  }catch(e){
    host.innerHTML=`<div class="exec-empty"><b>Dashboard could not be refreshed.</b><div style="margin-top:5px">${esc(String(e?.message||e))}</div></div>`;
  }
}

async function loadInvestmentIntelligence(){const host=$('idiDashboard');if(!host)return;host.innerHTML='<div class="status busy"><i class="dotStatus"></i><span>Building evidence loop…</span></div>';try{const d=await server('KOL_IDS_IDI_GET_DASHBOARD');const m=d.metrics||{};const card=(label,value,sub)=>`<div class="score"><span>${esc(label)}</span><b>${value==null?'—':esc(String(value))}</b><div class="sub" style="margin-top:5px">${esc(sub||'')}</div></div>`;host.innerHTML=`<div class="grid3">${card('Decision records',m.decisions,'Immutable decision ledger entries')}${card('Verified outcomes',m.outcomes,'Captured from business-impact records')}${card('Decision accuracy',m.decisionAccuracy==null?'—':m.decisionAccuracy+'%','Within ±15 outcome-index points; descriptive')}${card('Observed avg ROAS',m.avgObservedROAS==null?'—':m.avgObservedROAS+'x','Observed result, not a causal claim')}${card('Potentially inefficient spend',m.potentiallyInefficientSpend==null?'—':Number(m.potentiallyInefficientSpend).toLocaleString('en-US')+' THB','Low-score spend identified for review')}${card('Evidence grade',m.evidenceGrade,'Strength of current evidence')}${card('Prediction rank correlation',m.predictionRankCorrelation==null?'—':m.predictionRankCorrelation,'Decision ordering vs observed outcome ordering')}${card('Paired predictions',m.pairedOutcomes,'Predictions with actual outcomes')}${card('Total tracked spend',m.totalSpend==null?'—':Number(m.totalSpend).toLocaleString('en-US')+' THB','Recorded spend in the outcome ledger')}</div><div class="status ${m.evidenceGrade==='A'||m.evidenceGrade==='B'?'good':'warn'}" style="margin-top:12px"><i class="dotStatus"></i><span><b>Learning status:</b> ${esc((d.nextActions||[]).join(' '))}</span></div><div style="margin-top:13px"><b>Evidence / proof ledger</b><div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Metric</th><th>Value</th><th>Baseline</th><th>Delta</th><th>Evidence</th><th>Status</th><th>Sample</th></tr></thead><tbody>${(d.proof||[]).slice(-12).reverse().map(x=>`<tr><td>${esc(x.metric)}</td><td>${esc(x.value)}</td><td>${esc(x.baseline==null?'—':x.baseline)}</td><td>${esc(x.delta==null?'—':x.delta)}</td><td>${esc(x.evidenceLevel||'—')}</td><td>${esc(x.causalStatus||'—')}</td><td>${esc(x.sampleSize||'—')}</td></tr>`).join('')||'<tr><td colspan="7" class="sub">No proof records yet. Capture verified campaign outcomes to activate the learning loop.</td></tr>'}</tbody></table></div></div>`}catch(e){host.innerHTML=`<div class="status bad"><i class="dotStatus"></i><span>${esc(String(e?.message||e))}</span></div>`}}

function mountDecisionIntelligence(){
  const view=$('v4');if(!view||$('decisionIntel'))return;
  const host=document.createElement('div');host.className='card';host.id='decisionIntel';
  host.innerHTML='<div class="actions" style="margin-top:0"><div><h2>Decision Intelligence</h2><div class="sub">Explain the recommendation, expose evidence gaps, and compare a no-save what-if scenario.</div></div><div style="display:flex;gap:7px"><button class="btn ghost" onclick="loadDecisionBoard(false)">Refresh</button><button class="btn blue" onclick="loadDecisionBoard(true)">Simulate weights</button></div></div><div id="decisionBoard" style="margin-top:13px"></div>';
  view.appendChild(host);
  const report=document.createElement('div');report.className='card';report.id='decisionReportSnapshot';
  report.innerHTML='<div class="actions" style="margin-top:0"><div><h2>Current Analysis Report</h2><div class="sub">Live results from the same canonical report used by Reports & Evidence. This is read-only here and follows the active Analysis ID.</div></div><button class="btn ghost" type="button" onclick="loadDecisionReportSnapshot()">Refresh report</button></div><div id="decisionReportTable" style="margin-top:13px"></div>';
  view.appendChild(report);
}
function decisionReportValue(row,idx,names){
  for(const n of names){const i=idx[n.toLowerCase()];if(i!=null)return row[i];}
  return '';
}
function renderDecisionReportSnapshot(r){
  const host=$('decisionReportTable');if(!host)return;
  const rows=r&&Array.isArray(r.rows)?r.rows:[], headers=r&&Array.isArray(r.headers)?r.headers:[];
  if(!rows.length){host.innerHTML='<div class="empty">No current analysis report is available yet. Complete Analyze KOLs first.</div>';return;}
  const idx={};headers.forEach((h,i)=>idx[String(h||'').trim().toLowerCase()]=i);
  const cols=[
    ['KOL Name',['kol name','creator name','name']],
    ['Recommendation',['recommendation','decision']],
    ['Decision Score',['decision score','overall score','fit score']],
    ['Brand Fit',['brand fit score','brand fit']],
    ['Audience Fit',['audience fit']],
    ['Content Fit',['content fit']],
    ['Confidence',['confidence score','confidence']],
    ['Risk',['risk level','risk']],
    ['Evidence',['evidence status','evidence quality','evidence']]
  ];
  host.innerHTML='<div class="status good" style="margin-top:0"><i class="dotStatus"></i><span><b>Report loaded.</b> '+rows.length+' creator result(s) · Analysis '+esc(r.activeAnalysisId||'active')+'</span></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c[0])+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+cols.map(c=>'<td>'+esc(decisionReportValue(row,idx,c[1])==null?'—':String(decisionReportValue(row,idx,c[1])))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="sub" style="margin-top:9px">Source: canonical creator decision report. Performance/outcome data remains separate evidence and is not inferred from this analysis.</div>';
}
async function loadDecisionReportSnapshot(){
  const host=$('decisionReportTable');if(!host)return;
  host.innerHTML='<div class="status busy"><i class="dotStatus"></i><span>Loading current analysis report…</span></div>';
  try{const r=await server('KOL_IDS_SELF_GET_REPORT');state.report=r;renderDecisionReportSnapshot(r);return r;}
  catch(e){host.innerHTML='<div class="status bad"><i class="dotStatus"></i><span>'+esc(String(e?.message||e))+'</span></div>';return null;}
}
function decisionScenario(){return {budget:budgetNumber(),weights:{brand:num($('wBrand')?.value),audience:num($('wAudience')?.value),campaign:num($('wCampaign')?.value),confidence:num($('wConfidence')?.value),value:num($('wValue')?.value),risk:num($('wRisk')?.value)}}}
function renderDecisionBoard(b){const host=$('decisionBoard');if(!host)return;if(!b?.rankedCreators?.length){host.innerHTML=`<div class="status warn"><i class="dotStatus"></i><span>${esc((b?.nextBestActions||['Analyze creators before using Decision Intelligence.']).join(' '))}</span></div>`;return}host.innerHTML=`<div class="status ${b.decisionReady?'good':'warn'}"><i class="dotStatus"></i><span>${b.decisionReady?'Decision-ready context.':'Decision needs attention.'} ${esc((b.nextBestActions||[]).join(' '))}</span></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Rank</th><th>Creator</th><th>Recommendation</th><th>Decision</th><th>Fit</th><th>Impact</th><th>Confidence</th><th>Risk</th><th>Evidence</th></tr></thead><tbody>${b.rankedCreators.map(r=>`<tr><td>${esc(r.rank)}</td><td><b>${esc(r.name)}</b><div class="sub">${esc(r.platform)}</div></td><td><span class="badge b-${decisionTone(r.recommendation)}">${esc(r.recommendation)}</span></td><td><b>${esc(r.decisionScore)}</b></td><td>${esc(r.fit)}</td><td>${esc(r.impact)}</td><td>${esc(r.confidence)}</td><td>${esc(r.risk)}</td><td>${esc(r.evidenceStatus)}</td></tr><tr><td></td><td colspan="8" class="sub">${esc((r.gaps||[]).join(' ')||r.reasons.map(x=>x.signal+': '+x.value).join(' · '))}</td></tr>`).join('')}</tbody></table></div>`}
async function loadDecisionBoard(simulate){const host=$('decisionBoard');if(!host)return;host.innerHTML='<div class="status busy"><i class="dotStatus"></i><span>Building explainable recommendation…</span></div>';try{const b=simulate?await server('KOL_IDS_SIMULATE_DECISION',decisionScenario()):await server('KOL_IDS_GET_DECISION_BOARD');renderDecisionBoard(b)}catch(e){host.innerHTML=`<div class="status bad"><i class="dotStatus"></i><span>${esc(String(e?.message||e))}</span></div>`}}
mountDecisionIntelligence();
/* 1.0.0 canonical navigation wrapper: keep one go() wrapper only. */
const _KOL_IDS_GO_BASE=go;
go=function(n){
  _KOL_IDS_GO_BASE(n);
  if(n===4){loadDecisionBoard(false);loadDecisionReportSnapshot();}
  if(n===6){applyGenCodeState(state.flowContext);renderGenCodes();renderPerformance();}

};
