<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f6f8fb;color:#172033}.wrap{max-width:1100px;margin:40px auto;padding:0 20px}.hero,.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 28px rgba(20,30,50,.05)}h1{margin:0 0 8px;font-size:28px}.muted{color:#667085}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#172033;color:#fff}button.secondary{background:#eef2f7;color:#172033}button:disabled{opacity:.5;cursor:wait}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.metric{border:1px solid #e7ebf1;border-radius:12px;padding:14px}.metric b{font-size:22px;display:block}.pass{color:#087443}.fail{color:#b42318}.warn{color:#9a6700}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #edf0f4}.row:last-child{border-bottom:0}.pill{font-weight:800}.mono{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e5e7eb;border-radius:12px;padding:14px;max-height:360px;overflow:auto}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><section class="hero"><h1>KOL IDS™ Release Gate</h1><div class="muted">Deploy → run this gate → release only when automated checks are green. This page does not modify customer campaign data.</div><div class="actions"><button id="run">Run automated release gate</button><button class="secondary" id="inventory">Check production UI buttons</button><button class="secondary" id="refresh">Refresh</button></div><div id="summary" class="summary"></div></section><section class="card"><h2>Checks</h2><div id="checks" class="muted">Not run yet.</div></section><section class="card"><h2>Release decision</h2><div id="decision" class="muted">Run the gate.</div></section><section class="card"><h2>Technical output</h2><div id="raw" class="mono">—</div></section></main><script>const $=id=>document.getElementById(id);function showRaw(x){$('raw').textContent=JSON.stringify(x,null,2)}function server(fn,payload){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](payload)})}function render(r){const s=r?.summary||{};$('summary').innerHTML=`<div class="metric"><b>${s.passed??s.automatedPassed??0}</b><span>Passed</span></div><div class="metric"><b class="${(s.failed||0)?'fail':''}">${s.failed??0}</b><span>Failed</span></div><div class="metric"><b class="${(s.blocked||0)?'warn':''}">${s.blocked??0}</b><span>Blocked</span></div><div class="metric"><b>${s.total??s.automatedTests??0}</b><span>Total</span></div>`;const tests=r.checks||r.tests||[];$('checks').innerHTML=tests.length?tests.map(t=>`<div class="row"><span>${String(t.name||'')}</span><span class="pill ${t.pass===false||t.status==='FAIL'?'fail':t.status==='BLOCKED'?'warn':'pass'}">${t.pass===false||t.status==='FAIL'?'FAIL':t.status==='BLOCKED'?'BLOCKED':'PASS'}</span></div>`).join(''):'No checks returned.';const ok=r.success===true&&!(s.failed||0)&&!(s.blocked||0);$('decision').innerHTML=ok?'<strong class="pass">AUTOMATED PASS — proceed to browser smoke test.</strong>':'<strong class="fail">BLOCKED — fix failures before sale.</strong>';showRaw(r)}async function run(){const b=$('run');b.disabled=true;$('decision').textContent='Running…';try{render(await server('KOL_IDS_RELEASE_QA_RUNTIME_CONTRACT_'))}catch(e){$('decision').innerHTML='<strong class="fail">RUN FAILED</strong>';showRaw({error:String(e?.message||e)})}finally{b.disabled=false}}async function inventory(){const b=$('inventory');b.disabled=true;try{render(await server('KOL_IDS_RELEASE_QA_UI_BUTTON_INVENTORY'))}catch(e){$('decision').innerHTML='<strong class="fail">UI INVENTORY FAILED</strong>';showRaw({error:String(e?.message||e)})}finally{b.disabled=false}}$('run').onclick=run;$('inventory').onclick=inventory;$('refresh').onclick=()=>location.reload();</script></body></html>
