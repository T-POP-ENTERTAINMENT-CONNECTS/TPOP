<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f7fb;color:#172033}.wrap{max-width:1180px;margin:0 auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #e6e8ef;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(16,24,40,.04)}.num{font-size:32px;font-weight:700;margin-top:8px}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#111827;color:#fff}.ok{font-size:13px;margin-top:16px}.error{color:#b42318}.section{margin-top:24px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="top"><div><h1>KOL IDS Enterprise</h1><div id="identity" class="muted">Loading organization…</div></div><div class="row"><button class="btn" onclick="loadDash()">Refresh</button><button class="btn" onclick="qa()">Run QA</button></div></div><div id="cards" class="grid"></div><div class="section card"><h3>Enterprise platform</h3><div class="muted">Multi-brand • RBAC • Benchmarks • Validated models • Data ingestion • API • SLA • Audit • Integrations</div><div id="status" class="ok"></div></div></div>
<script>
function loadDash(){google.script.run.withSuccessHandler(function(x){document.getElementById('identity').textContent=(x.user.email||'')+' · '+x.user.role+' · '+x.orgId;var w=x.widgets||{};var cards=[['Benchmark coverage',w.benchmarkCoverage&&w.benchmarkCoverage.rows||0],['Validated models',w.validatedModels||0],['Open SLA',w.openSLA||0],['Onboarding in progress',w.onboarding||0]];document.getElementById('cards').innerHTML=cards.map(function(c){return '<div class="card"><div class="muted">'+c[0]+'</div><div class="num">'+c[1]+'</div></div>';}).join('');}).withFailureHandler(function(e){document.getElementById('status').innerHTML='<span class="error">'+(e.message||e)+'</span>';}).KOL_IDS_V25_enterpriseDashboard(window.orgId||'',window.brandId||'');}
function qa(){google.script.run.withSuccessHandler(function(x){document.getElementById('status').textContent=x.success?'QA passed: '+x.passed+'/'+x.tests+' checks.':('QA failed: '+x.failures.map(function(f){return f.name+(f.detail?' — '+f.detail:'');}).join(' | '));}).withFailureHandler(function(e){document.getElementById('status').innerHTML='<span class="error">'+(e.message||e)+'</span>';}).KOL_IDS_V25_QA();}
google.script.run.withSuccessHandler(function(id){window.orgId=id||'';loadDash();}).withFailureHandler(function(e){document.getElementById('status').innerHTML='<span class="error">'+(e.message||e)+'</span>';}).KOL_IDS_V25_currentOrg_();
</script></body></html>
