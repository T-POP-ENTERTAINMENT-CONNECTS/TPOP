<!doctype html>
<html lang="en-US" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5fbfd" />
  <meta name="description" content="KOL IDS™ — Decision Intelligence Workspace" />
  <title>KOL IDS™ — Intelligence Workspace</title>
  <link rel="stylesheet" href="styles.css" />

  <!--
    KOL IDS GitHub Workspace
    ------------------------
    This is the standalone web shell for the GitHub/Supabase version.
    The visual language is aligned with the latest KOL IDS Apps Script
    "kids" UI: light workspace, cyan active state, rounded cards,
    compact executive navigation and responsive layouts.

    IMPORTANT:
    - No Google Apps Script / google.script.run dependency is used here.
    - Authentication and data loading remain in app.js via Supabase.
    - app.js owns the live application markup inside #app.
  -->
  <style id="KOL_IDS_KIDS_VISUAL_SYSTEM">
    :root{
      --kids-sky:#cdf5ff;
      --kids-sky-strong:#46c9e8;
      --kids-ink:#3d131b;
      --kids-bg:#f5fbfd;
      --kids-card:#ffffff;
      --kids-line:#d9edf2;
      --kids-muted:#6f7d83;
      --kids-good:#147a5a;
      --kids-shadow:0 14px 40px rgba(61,19,27,.08);
      --kids-radius:18px;
    }

    html{background:var(--kids-bg)}
    body{
      margin:0;
      min-width:320px;
      background:
        radial-gradient(900px 420px at 78% -10%,rgba(70,201,232,.10),transparent 65%),
        linear-gradient(180deg,#f7fdff 0%,#eefaff 100%);
      color:var(--kids-ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    button,input,textarea,select{font:inherit}
    button{cursor:pointer}

    /* Auth / entry */
    .auth-wrap{
      min-height:100vh;
      display:grid;
      grid-template-columns:minmax(320px,520px) minmax(320px,1fr);
      align-items:stretch;
      gap:0;
      background:var(--kids-bg);
    }
    .auth-card{
      width:auto!important;
      max-width:none!important;
      min-height:100vh;
      padding:clamp(28px,6vw,72px);
      border:0!important;
      border-right:1px solid var(--kids-line)!important;
      border-radius:0!important;
      box-shadow:none!important;
      background:#fff!important;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .auth-side{
      min-height:100vh;
      display:flex!important;
      flex-direction:column;
      justify-content:center;
      padding:clamp(36px,7vw,100px);
      background:
        radial-gradient(650px 420px at 70% 35%,rgba(70,201,232,.18),transparent 65%),
        linear-gradient(145deg,#f7fdff,#eafaff);
      color:var(--kids-ink);
    }
    .auth-side h2{
      max-width:720px;
      font-size:clamp(36px,5vw,72px);
      line-height:1.02;
      letter-spacing:-.055em;
      margin:14px 0 18px;
    }
    .auth-side p{max-width:620px;color:var(--kids-muted);font-size:15px}
    .brandmark.large .brand-dot{
      width:38px;height:38px;border-radius:12px;
      background:var(--kids-sky);
      box-shadow:none;
      position:relative;
    }
    .brandmark.large .brand-dot:after{
      content:"";
      position:absolute;
      inset:9px;
      border-radius:7px;
      background:rgba(255,255,255,.72);
    }
    .auth-card label{color:var(--kids-ink);font-weight:800;font-size:12px}
    .auth-card input{
      border:1px solid #cfe5ea!important;
      border-radius:12px!important;
      background:#fff!important;
      padding:12px 13px!important;
      min-height:44px;
      margin-top:6px;
    }
    .auth-card .primary{
      min-height:44px;
      border-radius:11px;
      background:var(--kids-ink);
      border:1px solid var(--kids-ink);
      color:#fff;
      font-weight:900;
    }
    .link-btn{
      color:var(--kids-ink)!important;
      text-decoration:underline;
      text-underline-offset:3px;
    }

    /* Main workspace */
    .app-shell{
      min-height:100vh!important;
      display:grid!important;
      grid-template-columns:238px minmax(0,1fr)!important;
      gap:22px;
      max-width:1320px;
      margin:0 auto;
      padding:22px;
      background:transparent!important;
    }
    .sidebar{
      position:sticky;
      top:22px;
      height:calc(100vh - 44px);
      width:auto!important;
      min-width:0;
      padding:0!important;
      background:transparent!important;
      border:0!important;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .brandmark{
      min-height:66px;
      padding:0 12px 0!important;
      border:1px solid var(--kids-line);
      border-radius:16px;
      background:rgba(255,255,255,.82);
      box-shadow:var(--kids-shadow);
    }
    .brandmark .brand-dot{
      width:38px;height:38px;border-radius:12px;
      background:var(--kids-sky);
      box-shadow:none;
      position:relative;
    }
    .brandmark .brand-dot:after{
      content:"";
      position:absolute;
      inset:9px;
      border-radius:7px;
      background:rgba(255,255,255,.72);
    }
    .brandmark strong{
      font-size:17px!important;
      letter-spacing:-.03em!important;
      color:var(--kids-ink);
    }
    .brandmark span{font-size:10px!important;color:var(--kids-muted)!important}

    .sidebar nav{
      border:1px solid var(--kids-line);
      background:rgba(255,255,255,.82);
      border-radius:16px;
      padding:8px;
      box-shadow:var(--kids-shadow);
      display:grid;
      gap:3px;
    }
    .nav-item{
      width:100%;
      min-height:42px;
      border:0!important;
      background:transparent!important;
      text-align:left;
      padding:10px 12px!important;
      border-radius:11px!important;
      color:#738087!important;
      font-size:13px!important;
      font-weight:800!important;
      transition:.18s ease;
    }
    .nav-item:hover{background:#f1fbfe!important;color:var(--kids-ink)!important}
    .nav-item.active{
      background:var(--kids-sky)!important;
      color:var(--kids-ink)!important;
    }
    .side-foot{
      margin-top:auto!important;
      border:1px solid var(--kids-line)!important;
      border-radius:16px!important;
      padding:13px!important;
      background:#fff!important;
      color:var(--kids-ink)!important;
      box-shadow:var(--kids-shadow);
    }
    .side-foot span{display:block;font-weight:900;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .side-foot small{display:block;margin-top:6px;color:var(--kids-muted)!important;font-size:10px!important;white-space:normal!important}

    .main{min-width:0!important}
    .topbar{
      height:auto!important;
      min-height:72px;
      padding:0 3px 18px!important;
      background:transparent!important;
      border:0!important;
    }
    .topbar h1{
      font-size:34px!important;
      line-height:1.1;
      letter-spacing:-.055em!important;
      margin:5px 0 0!important;
      color:var(--kids-ink);
    }
    .eyebrow{
      color:#6e929b!important;
      font-size:10px!important;
      letter-spacing:1.4px!important;
      text-transform:uppercase;
      font-weight:900!important;
    }
    .ghost{
      border:1px solid var(--kids-line)!important;
      background:#fff!important;
      color:var(--kids-ink)!important;
      border-radius:11px!important;
      padding:10px 14px!important;
      font-weight:900!important;
    }
    .content{
      padding:0!important;
      max-width:none!important;
      min-width:0;
    }

    /* Kids-style content cards */
    .hero{
      padding:12px 3px 20px!important;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }
    .hero h2{
      font-size:clamp(28px,4vw,48px)!important;
      line-height:1.06;
      letter-spacing:-.055em!important;
      margin:7px 0 8px!important;
      max-width:820px;
    }
    .hero p{max-width:820px;color:var(--kids-muted)!important;margin:0}
    .primary{
      min-height:40px;
      border-radius:11px!important;
      border:1px solid var(--kids-ink)!important;
      background:var(--kids-ink)!important;
      color:#fff!important;
      padding:10px 14px!important;
      font-weight:900!important;
      box-shadow:none!important;
    }
    .primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(61,19,27,.12)!important}

    .stat-grid{
      display:grid!important;
      grid-template-columns:repeat(5,minmax(0,1fr))!important;
      gap:13px!important;
      margin:0 0 15px!important;
    }
    .stat{
      background:#fff!important;
      border:1px solid var(--kids-line)!important;
      border-radius:var(--kids-radius)!important;
      padding:18px!important;
      box-shadow:var(--kids-shadow)!important;
      min-width:0;
    }
    .stat span{font-size:10px!important;letter-spacing:.08em;text-transform:uppercase;color:var(--kids-muted)!important;font-weight:900}
    .stat strong{display:block;font-size:30px!important;letter-spacing:-.04em;margin-top:5px;color:var(--kids-ink)}

    .section-card{
      background:#fff!important;
      border:1px solid var(--kids-line)!important;
      border-radius:var(--kids-radius)!important;
      padding:20px!important;
      box-shadow:var(--kids-shadow)!important;
      margin-bottom:15px!important;
      min-width:0;
    }
    .section-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:15px;
      margin-bottom:13px;
      flex-wrap:wrap;
    }
    .section-head h3{
      font-size:18px!important;
      margin:4px 0 0!important;
      letter-spacing:-.025em;
    }
    .table-wrap{
      width:100%;
      overflow-x:auto!important;
      -webkit-overflow-scrolling:touch;
      border:1px solid var(--kids-line);
      border-radius:13px;
    }
    table{width:100%;min-width:680px;border-collapse:collapse}
    th{
      background:#f7fcfd;
      color:#738087;
      font-size:10px!important;
      letter-spacing:.08em;
      text-transform:uppercase;
      font-weight:900!important;
      text-align:left;
      padding:11px 12px!important;
      border-bottom:1px solid var(--kids-line);
    }
    td{
      padding:12px!important;
      border-bottom:1px solid #edf5f7!important;
      color:#46373c;
      font-size:13px;
    }
    tr:last-child td{border-bottom:0!important}
    .empty{
      color:var(--kids-muted)!important;
      text-align:center;
      padding:26px!important;
    }
    .flow{
      display:flex;
      align-items:center;
      gap:9px;
      flex-wrap:wrap;
      color:#60747b;
      font-weight:800;
      font-size:12px;
    }
    .flow span{
      padding:8px 10px;
      border:1px solid var(--kids-line);
      border-radius:999px;
      background:#fbfeff;
    }
    .flow i{font-style:normal;color:var(--kids-sky-strong);font-weight:900}

    .analysis-grid{
      display:grid!important;
      grid-template-columns:repeat(3,minmax(0,1fr))!important;
      gap:13px!important;
    }
    .creator-card{
      background:#fcfeff!important;
      border:1px solid var(--kids-line)!important;
      border-radius:16px!important;
      padding:15px!important;
      min-width:0;
    }
    .creator-card h3{font-size:15px!important;margin:10px 0 3px!important}
    .creator-card p{color:var(--kids-muted)!important;font-size:12px;margin:0 0 14px!important}
    .avatar{
      width:48px!important;height:48px!important;
      border-radius:14px!important;
      display:grid!important;
      place-items:center!important;
      background:var(--kids-sky)!important;
      color:var(--kids-ink)!important;
      font-weight:900!important;
      font-size:18px!important;
    }
    .score-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:9px 0;
      border-top:1px solid #edf5f7;
      font-size:11px;
    }
    .score-row strong{font-size:12px}

    .toast{
      border:1px solid var(--kids-line)!important;
      border-radius:13px!important;
      box-shadow:0 14px 35px rgba(61,19,27,.14)!important;
    }

    .setup{
      min-height:100vh;
      display:grid;
      place-items:center;
      text-align:center;
      padding:30px;
    }

    /* Responsive */
    @media (max-width:1100px){
      .app-shell{grid-template-columns:210px minmax(0,1fr)!important}
      .stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
      .analysis-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
    }
    @media (max-width:820px){
      .app-shell{
        display:block!important;
        padding:12px;
      }
      .sidebar{
        position:relative;
        top:auto;
        height:auto;
        margin-bottom:14px;
      }
      .brandmark{min-height:58px}
      .sidebar nav{
        display:flex;
        overflow-x:auto;
        gap:4px;
        padding:6px;
        scrollbar-width:thin;
      }
      .nav-item{
        flex:0 0 auto;
        width:auto;
        white-space:nowrap;
      }
      .side-foot{display:none}
      .topbar{padding:4px 2px 14px!important}
      .topbar h1{font-size:28px!important}
      .hero{padding-top:4px!important}
    }
    @media (max-width:620px){
      .auth-wrap{grid-template-columns:1fr}
      .auth-card{min-height:auto;padding:34px 22px!important}
      .auth-side{display:none!important}
      .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
      .analysis-grid{grid-template-columns:1fr!important}
      .section-card{padding:15px!important}
      .hero h2{font-size:30px!important}
      .topbar{align-items:flex-start!important}
      .top-actions{gap:7px!important}
      .user-email{display:none}
    }
    @media (max-width:400px){
      .stat-grid{grid-template-columns:1fr!important}
      .app-shell{padding:8px}
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Supabase is the GitHub/cloud runtime. No Apps Script bridge is loaded. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
