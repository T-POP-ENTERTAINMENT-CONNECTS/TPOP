<script id="KOL_IDS_V25_18_4_TRIAL_TO_FORM_AND_REPORT_GATE">
(function(){
  'use strict';
  var busy=false;
  function byId(id){return document.getElementById(id)}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function msg(text,type){var e=byId('accessStatus');if(e)e.innerHTML='<div class="status '+(type||'warn')+'"><i class="dotStatus"></i><span>'+esc(text)+'</span></div>'}
  function rpc(name,arg){return new Promise(function(resolve,reject){try{if(typeof google==='undefined'||!google.script||!google.script.run)throw new Error('Google Apps Script connection is unavailable.');var r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(arg===undefined)r[name]();else r[name](arg)}catch(e){reject(e)}})}

  function ensureModal(){
    var m=byId('kolIdsCommercialModal');if(m)return m;
    m=document.createElement('div');m.id='kolIdsCommercialModal';m.style.cssText='position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(20,12,15,.48);backdrop-filter:blur(8px);';
    m.innerHTML='<div style="width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid #e7dcde;border-radius:22px;box-shadow:0 30px 80px rgba(30,10,15,.24);padding:24px"><div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start"><div><div style="font-size:10px;letter-spacing:1.8px;font-weight:900;color:#8b7076">KOL IDS · COMMERCIAL ACCESS</div><h2 id="kolIdsModalTitle" style="margin:6px 0 5px;font-size:24px;color:#3d131b">Choose your workspace plan</h2><div id="kolIdsModalSub" style="font-size:13px;color:#6f7d83">Use the same secure sales form. Trial requires no payment.</div></div><button type="button" id="kolIdsModalClose" style="border:1px solid #e3d9db;background:#fff;border-radius:10px;padding:8px 11px;font-weight:800;color:#3d131b;cursor:pointer">✕</button></div><div id="kolIdsModalBody" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px"></div></div>';
    document.body.appendChild(m);
    byId('kolIdsModalClose').addEventListener('click',closeModal);
    m.addEventListener('click',function(e){if(e.target===m)closeModal()});
    return m;
  }
  function closeModal(){var m=byId('kolIdsCommercialModal');if(m)m.style.display='none'}
  function showPlans(mode){
    ensureModal();
    var title=byId('kolIdsModalTitle'),sub=byId('kolIdsModalSub'),body=byId('kolIdsModalBody');
    if(title)title.textContent=mode==='trial'?'Start your 7-day free trial':'Continue with a paid KOL IDS plan';
    if(sub)sub.textContent=mode==='trial'?'Choose the package you want to evaluate. Your Client ID + Access Key will be created by the system and stay with this workspace.':'Choose the plan you want to purchase. Your existing Client ID will be preserved when upgrading a Trial workspace.';
    if(body)body.innerHTML='<div style="grid-column:1/-1;padding:18px;border:1px solid #e8e0e2;border-radius:14px;color:#6f7d83">Loading secure order forms…</div>';
    var m=byId('kolIdsCommercialModal');if(m)m.style.display='flex';
    rpc('KOL_IDS_COMMERCIAL_PLAN_FORM_URLS').then(function(data){
      var packs=[];try{packs=Object.keys(data&&data.urls||{}).map(function(k){return {key:k,url:data.urls[k],trialUrl:data.trialUrls&&data.trialUrls[k]||'',name:(data.packages&&data.packages[k]&&data.packages[k].name)||k}})}catch(ignore){}
      return rpc('KOL_IDS_COMMERCIAL_PACKAGES').then(function(p){return {data:data,packs:p||[]}});
    }).then(function(x){
      var data=x.data||{},plans=x.packs||[];
      if(!body)return;
      body.innerHTML=plans.map(function(p,i){
        var href='https://docs.google.com/forms/d/e/1FAIpQLScv-WC7h4CiyZ0EPm-_uTf-fhTSjUR5nXC9mC9cvWt0XknoNA/viewform';
        var label=mode==='trial'?'Start 7-Day Trial':'Open Order Form';
        var note=mode==='trial'?'No payment · same workspace after upgrade':'Paid subscription · existing workspace preserved';
        return '<div style="border:1px solid #e4dadd;border-radius:17px;padding:17px;background:#fff;display:flex;flex-direction:column;min-height:245px;box-shadow:'+(i===1?'0 0 0 2px #cdf5ff':'none')+'"><div style="font-size:10px;letter-spacing:1.2px;font-weight:900;color:#8b7076">'+esc(Number(p.months||0))+' MONTHS</div><div style="font-size:21px;font-weight:900;color:#3d131b;margin-top:5px">'+esc(p.name)+'</div><div style="font-size:24px;font-weight:900;color:#3d131b;margin:9px 0">THB '+Number(p.price||0).toLocaleString('en-US')+'</div><div style="font-size:11px;color:#6f7d83;line-height:1.55">'+esc(note)+'</div><div style="font-size:11px;color:#6f7d83;margin-top:8px">'+Number(p.maxAccounts||1)+' Google Account'+(Number(p.maxAccounts||1)===1?'':'s')+' · same Client ID + Access Key</div><a '+(href?'href="'+esc(href)+'" target="_blank" rel="noopener noreferrer"':'href="#" aria-disabled="true"')+' style="display:block;text-align:center;margin-top:auto;padding:11px 12px;border-radius:11px;background:#3d131b;color:#fff;text-decoration:none;font-weight:900;font-size:12px">'+esc(label)+' →</a></div>';
      }).join('');
    }).catch(function(e){if(body)body.innerHTML='<div style="grid-column:1/-1" class="status bad"><i class="dotStatus"></i><span>Unable to prepare the order form: '+esc(e.message||e)+'</span></div>'});
  }

  function openSubscribe(){showPlans('paid')}
  function openTrialPlans(){showPlans('trial')}
  window.KOL_IDS_OPEN_SUBSCRIBE=openSubscribe;

  function install(){
    var b=byId('trialFormLink');
    if(b&&!b.__v184){b.__v184=true;b.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();openTrialPlans()},true);}
  }

  function showUpgradePopup(){
    var m=byId('kolIdsUpgradeModal');
    if(!m){
      m=document.createElement('div');m.id='kolIdsUpgradeModal';m.style.cssText='position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(20,12,15,.52);backdrop-filter:blur(8px)';
      m.innerHTML='<div style="width:min(520px,100%);background:#fff;border:1px solid #e7dcde;border-radius:22px;padding:25px;box-shadow:0 30px 80px rgba(30,10,15,.25);color:#3d131b"><div style="font-size:10px;letter-spacing:1.8px;font-weight:900;color:#8b7076">REPORT EXPORT</div><h2 style="margin:7px 0 8px;font-size:24px">Unlock your report</h2><p style="margin:0;color:#6f7d83;font-size:13px;line-height:1.6">Download / Export Report is available with a paid KOL IDS subscription. Your Trial workspace and all saved data will remain in place.</p><div style="margin-top:19px;padding:13px;border:1px solid #eee4e6;border-radius:13px;background:#fbf8f7;font-size:12px;color:#6f7d83"><b style="color:#3d131b">Continue with the same workspace?</b><br>Upgrade keeps the same Client ID and Access Key.</div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:20px"><button id="kolIdsUpgradeNo" type="button" class="btn ghost">No — Go Home</button><button id="kolIdsUpgradeYes" type="button" class="btn blue">Yes — Continue</button></div></div>';
      document.body.appendChild(m);
      byId('kolIdsUpgradeNo').addEventListener('click',function(){closeUpgradeAndGoHome()});
      byId('kolIdsUpgradeYes').addEventListener('click',function(){closeUpgradeModal();openSubscribe()});
    }
    m.style.display='flex';
  }
  function closeUpgradeModal(){var m=byId('kolIdsUpgradeModal');if(m)m.style.display='none'}
  function closeUpgradeAndGoHome(){closeUpgradeModal();try{if(typeof window.go==='function')window.go(1)}catch(ignore){}try{if(typeof window.KOL_IDS_HOME==='function')window.KOL_IDS_HOME()}catch(ignore){}window.location.href=window.location.href.split('#')[0]}

  function gate(){
    var p=rpc('KOL_IDS_COMMERCIAL_GET_ACCESS');
    return p.then(function(a){
      var trial=a&&a.allowed&&((String(a.accessType||'').toUpperCase()==='TRIAL')||(a.entitlements&&a.entitlements.reportExport===false));
      if(trial){showUpgradePopup();return true}return false;
    }).catch(function(){return false});
  }
  window.KOL_IDS_TRIAL_REPORT_GATE=gate;
  window.KOL_IDS_LOCK_REPORT_FOR_TRIAL=function(){showUpgradePopup();return true};

  function patchReports(){
    if(typeof window.loadReports==='function'&&!window.__V184_REPORT_PATCHED__){
      var original=window.loadReports;window.__V184_REPORT_PATCHED__=true;
      window.loadReports=async function(){if(await gate())return;return original.apply(this,arguments)};
    }
    if(typeof window.exportCurrent==='function'&&!window.__V184_EXPORT_PATCHED__){
      var exportOriginal=window.exportCurrent;window.__V184_EXPORT_PATCHED__=true;
      window.exportCurrent=async function(){if(await gate())return;return exportOriginal.apply(this,arguments)};
    }
    if(typeof window.KOL_IDS_PRINT_PDF_==='function'&&!window.__V184_PDF_PATCHED__){
      var pdfOriginal=window.KOL_IDS_PRINT_PDF_;window.__V184_PDF_PATCHED__=true;
      window.KOL_IDS_PRINT_PDF_=async function(type){if(await gate())return;return pdfOriginal.apply(this,arguments)};
    }
  }
  function watch(){install();patchReports();if(!window.__V184_REPORT_PATCHED__||!window.__V184_EXPORT_PATCHED__||!window.__V184_PDF_PATCHED__)setTimeout(watch,500)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch,{once:true});else watch();
})();
</script>
