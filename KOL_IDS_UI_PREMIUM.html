<style id="KOL_IDS_EXECUTIVE_PREMIUM_10X">
:root{
  --lux-ink:#17131a;
  --lux-ink-2:#2a222d;
  --lux-gold:#b89a5a;
  --lux-gold-2:#d8bf82;
  --lux-ivory:#fbfaf7;
  --lux-paper:#ffffff;
  --lux-line:rgba(23,19,26,.10);
  --lux-muted:#7c7480;
  --lux-shadow:0 24px 70px rgba(23,19,26,.09);
  --lux-shadow-sm:0 10px 30px rgba(23,19,26,.07);
  --lux-radius:22px;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(900px 420px at 78% -10%,rgba(216,191,130,.14),transparent 65%),
    radial-gradient(720px 360px at 10% 0%,rgba(70,201,232,.09),transparent 62%),
    linear-gradient(180deg,#fdfcf9 0%,#f5f4f1 100%);
  color:var(--lux-ink);
  letter-spacing:-.01em;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.25;
  background-image:linear-gradient(rgba(23,19,26,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(23,19,26,.025) 1px,transparent 1px);
  background-size:42px 42px;
}
.top{
  height:78px;padding:0 30px;
  background:rgba(253,252,249,.82);
  border-bottom:1px solid rgba(23,19,26,.08);
  box-shadow:0 8px 30px rgba(23,19,26,.035);
}
.mark{
  width:42px;height:42px;border-radius:13px;
  background:linear-gradient(145deg,var(--lux-ink),#43313e);
  color:#f8e7bd;box-shadow:0 9px 25px rgba(23,19,26,.20);
  position:relative;overflow:hidden;
}
.mark:after{content:"";position:absolute;inset:1px;border:1px solid rgba(216,191,130,.45);border-radius:12px}
.brand b{font-size:18px;letter-spacing:.02em}
.brand small{color:var(--lux-gold);font-weight:800;letter-spacing:.13em}
.topmeta .pill{background:rgba(255,255,255,.72);border-color:var(--lux-line);box-shadow:0 5px 18px rgba(23,19,26,.035)}
.layout{max-width:1440px;grid-template-columns:252px minmax(0,1fr);gap:26px;padding:26px}
.side{top:104px;height:calc(100vh - 130px);gap:10px}
.nav{
  padding:9px;background:rgba(255,255,255,.70);
  border:1px solid rgba(23,19,26,.08);border-radius:20px;box-shadow:var(--lux-shadow-sm);
  backdrop-filter:blur(16px)
}
.nav button{
  padding:12px 13px;border-radius:13px;color:#756e78;font-size:13px;
  transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
}
.nav button:hover{background:#f5f1e8;color:var(--lux-ink);transform:translateX(2px)}
.nav button.active{
  color:#fff;background:linear-gradient(135deg,var(--lux-ink),#44333f);
  box-shadow:0 9px 22px rgba(23,19,26,.16)
}
.nav button.active:before{content:"";display:inline-block;width:4px;height:16px;border-radius:99px;background:var(--lux-gold-2);vertical-align:-3px;margin-right:8px}
.sidecard{border-color:rgba(23,19,26,.08);border-radius:18px;box-shadow:var(--lux-shadow-sm);background:rgba(255,255,255,.78)}
.hero{padding:15px 4px 24px}
.eyebrow{color:var(--lux-gold);letter-spacing:.20em}
.hero h1{font-size:39px;letter-spacing:-.045em}
.hero p{color:#746d77}
.card{
  border-color:rgba(23,19,26,.085);border-radius:var(--lux-radius);
  box-shadow:var(--lux-shadow);background:rgba(255,255,255,.91);
  padding:22px;backdrop-filter:blur(10px);
  transition:box-shadow .2s ease,transform .2s ease

.card:hover{box-shadow:0 28px 80px rgba(23,19,26,.11)}
.card h2{font-size:16px;letter-spacing:-.02em}
.card h3{font-size:13px;letter-spacing:.01em}
input,select,textarea{
  border-color:rgba(23,19,26,.13);border-radius:13px;background:#fff;color:var(--lux-ink);
  box-shadow:0 2px 8px rgba(23,19,26,.025);padding:12px 13px
}
input:focus,select:focus,textarea:focus{
  border-color:var(--lux-gold);box-shadow:0 0 0 4px rgba(184,154,90,.13)
}
.btn{
  border-color:rgba(23,19,26,.11);border-radius:13px;padding:11px 15px;
  transition:transform .16s ease,box-shadow .16s ease,filter .16s ease
}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 9px 22px rgba(23,19,26,.09)}
.btn.primary{
  background:linear-gradient(135deg,#17131a,#493440);border-color:#17131a;
  box-shadow:0 9px 24px rgba(23,19,26,.16)
}
.btn.blue{background:linear-gradient(135deg,#edfafd,#d9f5fa);border-color:#b8e9f1}
.status{border-color:rgba(23,19,26,.08);border-radius:14px}
.kol,.review,.tablewrap{border-color:rgba(23,19,26,.09);border-radius:16px}
.kol{background:linear-gradient(180deg,#fff,#fbfaf8)}
.score{border-color:rgba(23,19,26,.08);border-radius:14px}
.score b{font-size:21px;letter-spacing:-.03em}
.badge{letter-spacing:.03em}
th{background:#f7f4ee;color:#756d76}
td{border-color:rgba(23,19,26,.07)}
.globalOpStatus{
  border-color:rgba(184,154,90,.34);background:rgba(255,255,255,.96);
  box-shadow:0 20px 55px rgba(23,19,26,.18);border-radius:17px
}
.globalOpSpinner{border-color:#eadfc6;border-top-color:var(--lux-gold)}
/* Executive dashboard hierarchy */
.kcc-card{border-color:rgba(23,19,26,.09)!important;border-radius:24px!important;box-shadow:var(--lux-shadow)!important;background:rgba(255,255,255,.94)!important}
.kcc-topline h2{font-size:29px!important;letter-spacing:-.045em}
.kcc-eyebrow{color:var(--lux-gold)!important;letter-spacing:.18em!important}
.kcc-kpi{border-color:rgba(23,19,26,.08)!important;border-radius:17px!important;background:linear-gradient(180deg,#fff,#faf9f6)!important;box-shadow:0 8px 24px rgba(23,19,26,.045)}
.kcc-kpi.hero{background:linear-gradient(135deg,#17131a,#493440)!important;border-color:#17131a!important}
.kcc-panel{border-color:rgba(23,19,26,.08)!important;border-radius:18px!important}
.kcc-panel-head span{color:var(--lux-gold)!important}
.kcc-funnel-grid div{background:#faf8f3!important;border-color:rgba(23,19,26,.07)!important}
.kcc-trend-bars i{background:var(--lux-gold)!important}.kcc-trend-bars em{background:var(--lux-ink)!important}
.kcc-risk-track i{background:linear-gradient(90deg,#d8bf82,#493440)!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:grid;grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.top{padding:0 15px}.layout{padding:15px}.hero h1{font-size:31px}.card{padding:17px;border-radius:18px}}
</style>

<script id="KOL_IDS_EXECUTIVE_COHESION_RUNTIME">
(function(){
  'use strict';
  /* Presentation-only runtime: observes the canonical UI state without replacing any
     existing RPC, state, scoring, or rendering contracts. */
  var ready=false;
  function byId(id){return document.getElementById(id)}
  function markReady(){
    if(ready)return;
    ready=true;
    document.documentElement.setAttribute('data-kol-ids-ui','premium-cohesive');
    var boot=byId('boot');
    if(boot && boot.classList.contains('boot')) boot.setAttribute('data-premium-ready','1');
  }
  function bind(){
    /* Keep navigation, state and report modules loosely coupled through events only. */
    document.addEventListener('KOL_IDS_STATE_UPDATED',function(){markReady()});
    document.addEventListener('KOL_IDS_REPORT_UPDATED',function(){markReady()});
    document.addEventListener('KOL_IDS_WORKSPACE_READY',function(){markReady()});
    if(document.body)markReady();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});
  else bind();
  window.KOL_IDS_EXECUTIVE_UI_READY=function(){markReady();return {ok:true,mode:'premium-cohesive'}};
})();
</script>
