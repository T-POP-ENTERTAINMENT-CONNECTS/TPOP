<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#2a171b;--wine:#3d131b;--rose:#f5e8ea;--line:#eadfe1;--muted:#7a6c70;--paper:#fffdfc;--bg:#f7f3f2}
*{box-sizing:border-box}body{font:14px Inter,Arial,sans-serif;margin:0;background:linear-gradient(135deg,#f8f5f4,#fff);color:var(--ink)}.wrap{max-width:1120px;margin:auto;padding:34px 20px 60px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:2.5px;color:#8a6c72;font-weight:800}.title{font-size:30px;font-weight:800;margin:7px 0}.muted{color:var(--muted);line-height:1.55}.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 10px 30px rgba(61,19,27,.05)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.input{padding:11px 13px;border:1px solid #dcd0d3;border-radius:10px;background:#fff;outline:none}.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--wine);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--wine);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{padding:12px 13px;border:1px solid #eee4e5;border-radius:12px;background:#fff}.field small{display:block;color:#8a7b7e;font-size:11px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px}.field b{font-size:14px;word-break:break-word}.status{display:inline-flex;padding:6px 9px;border-radius:999px;background:#f5ecee;color:var(--wine);font-weight:800;font-size:11px}.status.approved{background:#edf7f2;color:#245f48}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.order-title{font-size:18px;font-weight:800}.order-meta{color:var(--muted);margin-top:5px}.proof{margin-top:16px;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fcf8f8}.proof a{color:var(--wine);font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:20px 12px}.top{display:block}.title{font-size:25px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">KOL IDS · SALES CONTROL</div><div class="title">Orders & Approval</div><div class="muted">Complete submission preview · payment evidence · entitlement review</div></div></div><div class="card"><div class="toolbar"><button class="btn secondary" onclick="load()">Refresh Orders</button><button class="btn secondary" onclick="setup()">Refresh Form</button><span id="setup" class="muted"></span></div><div class="muted" style="margin-top:9px">Admin access is verified by your authorized Google account. No PIN is required.</div></div><div id="orders"><div class="card empty">Loading requests…</div></div></div><script>
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const q=new URLSearchParams(location.search),focus=q.get('order')||'';
function setup(){google.script.run.withSuccessHandler(r=>{document.getElementById('setup').textContent='Form ready';load()}).withFailureHandler(e=>alert(e.message)).KOL_IDS_V5_setupSales()}
function proofLink(url){if(!url)return '<span class="muted">No payment proof link provided</span>';return /^https?:\/\//i.test(url)?'<a target="_blank" rel="noopener" href="'+esc(url)+'">Open payment proof / slip ↗</a>':'<span>'+esc(url)+'</span>'}
function field(label,value){return '<div class="field"><small>'+esc(label)+'</small><b>'+esc(value==null||value===''?'—':value)+'</b></div>'}
function card(x){let status=String(x.status||'').toUpperCase();return '<div class="card"><div class="order-head"><div><div class="order-title">'+esc(x.customerName||'Customer')+'</div><div class="order-meta">'+esc(x.orderId)+' · '+esc(x.orderType||'REQUEST')+' · '+esc(x.plan||'—')+'</div></div><span class="status '+(status==='APPROVED'?'approved':'')+'">'+esc(x.status||'PENDING')+'</span></div><div class="grid" style="margin-top:15px">'+field('Customer Type',x.customerType)+field('Email',x.email)+field('Phone',x.phone)+field('Company',x.company)+field('Plan',x.plan)+field('Amount',(x.amount||'—')+' '+(x.currency||''))+field('Google Accounts',x.googleAccountsRequested)+field('Existing Client ID',x.existingClientId)+field('Existing License ID',x.existingLicenseId)+field('Payment Status',x.paymentStatus)+field('Product',x.product)+field('Submitted',x.timestamp)+'</div><div class="proof"><b>Payment evidence</b><div style="margin-top:7px">'+proofLink(x.slipUrl)+'</div></div>'+(x.message?'<div class="proof"><b>Customer message</b><div style="margin-top:7px;white-space:pre-wrap">'+esc(x.message)+'</div></div>':'')+(status==='PENDING'?'<div class="actions"><button class="btn" onclick="approve(this,\''+encodeURIComponent(x.orderId)+'\')">APPROVE & ISSUE</button></div>':'')+'</div>'}
function load(){google.script.run.withSuccessHandler(r=>{let rows=r.rows||[];document.getElementById('orders').innerHTML=rows.map(card).join('')||'<div class="card empty">No orders.</div>';if(focus){const el=[...document.querySelectorAll('.card')].find(x=>x.innerText.includes(focus));if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}}).withFailureHandler(e=>document.getElementById('orders').innerHTML='<div class="card empty">'+esc(e.message)+'</div>').KOL_IDS_V5_adminOrders()}
function approve(btn,e){const id=decodeURIComponent(e);if(btn){btn.disabled=true;btn.textContent='APPROVING…';}google.script.run.withSuccessHandler(r=>{if(btn){btn.textContent='APPROVED ✓';}alert('Approved\nClient ID: '+(r.clientId||'-')+'\nAccess Key: '+(r.accessKey||'ใช้ Access Key เดิม')+'\nPlan: '+(r.plan||'-'));load()}).withFailureHandler(err=>{if(btn){btn.disabled=false;btn.textContent='APPROVE & ISSUE';}alert(err.message)}).KOL_IDS_V5_adminApprove(id)}
load();setInterval(load,30000);
</script></body></html>
